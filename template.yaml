AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SolarOps Copilot - live AEMO solar farm ingestion, read API and copilot

Parameters:
  DatabaseUrlParam:
    Type: String
    Default: solarops/database-url
    Description: SSM SecureString (name without leading slash) holding the Postgres URL
  OpenElectricityKeyParam:
    Type: String
    Default: solarops/openelectricity-api-key
    Description: SSM SecureString holding the Open Electricity key
  ApiKeyParam:
    Type: String
    Default: solarops/api-key
    Description: SSM SecureString holding the x-api-key clients must send to /v1 routes
  LlmProvider:
    Type: String
    Default: none
    AllowedValues: [none, bedrock, openai]
    Description: Copilot model provider. "none" uses the deterministic router (free).
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile ID, used when LlmProvider=bedrock
  EmbeddingsProvider:
    Type: String
    Default: none
    AllowedValues: [none, bedrock, openai]
    Description: Dense embeddings for hybrid knowledge-base retrieval. "none" uses BM25 only (free).
  BedrockEmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model, used when EmbeddingsProvider=bedrock
  OpenAIKeyParam:
    Type: String
    Default: solarops/openai-api-key
    Description: SSM SecureString holding an OpenAI key, used when LlmProvider=openai
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 3
    Description: Days of telemetry to keep in Postgres (raw files stay in S3 for a year)
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address for alarm notifications

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 60
    Tracing: Active # X-Ray; SAM adds the write permissions
    Environment:
      Variables:
        DATABASE_URL_PARAM: !Sub /${DatabaseUrlParam}
        OPENELECTRICITY_API_KEY_PARAM: !Sub /${OpenElectricityKeyParam}
        RAW_BUCKET: !Ref RawBucket
        QUEUE_URL: !Ref IngestQueue
        POWERTOOLS_SERVICE_NAME: solarops
        POWERTOOLS_METRICS_NAMESPACE: SolarOps

Resources:
  # ---------------- ingestion (Phase 1) ----------------

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TierThenExpireRawFiles
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            ExpirationInDays: 365

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360 # 6x the worker timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 5

  PollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.poll_handler
      Description: Lists new NEMWeb SCADA files and queues them
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
      Events:
        Every5Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.ingest_handler
      Description: Downloads, archives and loads one SCADA file per message
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawBucket
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            # Caps concurrent workers (protects DB connections) without reserving
            # account concurrency, which new AWS accounts have very little of.
            ScalingConfig:
              MaximumConcurrency: 2

  RegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.registry_handler
      Description: Refreshes the solar farm registry
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
        - SSMParameterReadPolicy:
            ParameterName: !Ref OpenElectricityKeyParam
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 18 * * ? *) # 04:00 NEM time

  WeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.weather_handler
      Description: Records current irradiance at every solar farm
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  DispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.dispatch_handler
      Description: Loads next-day AEMO dispatch outcomes (curtailment ground truth)
      MemorySize: 1024
      Timeout: 300
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
      Events:
        Every6Hours:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(6 hours) # the daily file's publish time varies

  RetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.handlers.retention_handler
      Description: Deletes telemetry older than RetentionDays from Postgres
      Environment:
        Variables:
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 17 * * ? *) # 03:30 NEM time

  # ---------------- read API + copilot (Phase 2) ----------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: # rate limiting at the edge, before any Lambda runs
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, x-api-key]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: solarops.api.handler
      Description: Read-only HTTP API, tool-calling copilot and knowledge-base retrieval
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          API_KEY_PARAM: !Sub /${ApiKeyParam}
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EMBEDDINGS_PROVIDER: !Ref EmbeddingsProvider
          BEDROCK_EMBED_MODEL_ID: !Ref BedrockEmbedModelId
          OPENAI_API_KEY_PARAM: !Sub /${OpenAIKeyParam}
          CACHE_TTL_SECONDS: "60"
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref DatabaseUrlParam
        - SSMParameterReadPolicy:
            ParameterName: !Ref ApiKeyParam
        - SSMParameterReadPolicy:
            ParameterName: !Ref OpenAIKeyParam
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ---------------- observability ----------------

  # Custom metrics are written as EMF log lines by solarops/observability.py
  # (namespace SolarOps, dimension service=solarops, plus route / reason where noted).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "API requests and errors",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 300,
              "metrics": [
                ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", {"label": "requests"}],
                ["AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", {"label": "4xx"}],
                ["AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", {"label": "5xx"}]
              ]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "API p95 latency (ms)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "p95",
              "period": 300,
              "metrics": [
                ["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", {"label": "API Gateway p95"}],
                [{"expression": "SEARCH('{SolarOps,service,route} MetricName=\"ApiLatencyMs\"', 'p95', 300)", "id": "routes", "label": ""}]
              ]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Copilot latency (ms)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "p95",
              "period": 300,
              "metrics": [
                ["SolarOps", "CopilotLatencyMs", "service", "solarops", {"stat": "p50", "label": "p50"}],
                ["SolarOps", "CopilotLatencyMs", "service", "solarops", {"stat": "p95", "label": "p95"}]
              ]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Copilot fallbacks by reason",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 300,
              "metrics": [
                [{"expression": "SEARCH('{SolarOps,service,reason} MetricName=\"CopilotFallbacks\"', 'Sum', 300)", "id": "fallbacks", "label": ""}]
              ]}},
            {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
              "title": "LLM tokens",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 300,
              "metrics": [
                ["SolarOps", "LlmInputTokens", "service", "solarops", {"label": "input"}],
                ["SolarOps", "LlmOutputTokens", "service", "solarops", {"label": "output"}]
              ]}},
            {"type": "metric", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
              "title": "LLM cost (USD per hour)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 3600,
              "metrics": [
                ["SolarOps", "LlmCostUsd", "service", "solarops", {"label": "cost"}]
              ]}},
            {"type": "metric", "x": 0, "y": 18, "width": 12, "height": 6, "properties": {
              "title": "Ingest lag (minutes behind the latest AEMO interval)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Maximum",
              "period": 300,
              "annotations": {"horizontal": [{"label": "stale", "value": 30}]},
              "metrics": [
                ["SolarOps", "IngestLagMinutes", "service", "solarops", {"label": "lag"}]
              ]}},
            {"type": "metric", "x": 12, "y": 18, "width": 12, "height": 6, "properties": {
              "title": "Rows ingested (solar readings)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 300,
              "metrics": [
                ["SolarOps", "RowsIngested", "service", "solarops", {"label": "rows"}]
              ]}},
            {"type": "metric", "x": 0, "y": 24, "width": 12, "height": 6, "properties": {
              "title": "Dead-letter queue depth",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Maximum",
              "period": 300,
              "metrics": [
                ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${IngestDLQ.QueueName}", {"label": "DLQ messages"}]
              ]}},
            {"type": "metric", "x": 12, "y": 24, "width": 12, "height": 6, "properties": {
              "title": "Curtailed farms (latest scored interval)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Maximum",
              "period": 300,
              "metrics": [
                ["SolarOps", "CurtailedFarms", "service", "solarops", {"label": "farms"}]
              ]}},
            {"type": "metric", "x": 0, "y": 30, "width": 12, "height": 6, "properties": {
              "title": "Lambda errors per function",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "Sum",
              "period": 300,
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${PollFunction}", {"label": "Poll"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${IngestFunction}", {"label": "Ingest"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${RegistryFunction}", {"label": "Registry"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${WeatherFunction}", {"label": "Weather"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${DispatchFunction}", {"label": "Dispatch"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${RetentionFunction}", {"label": "Retention"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", {"label": "Api"}]
              ]}},
            {"type": "metric", "x": 12, "y": 30, "width": 12, "height": 6, "properties": {
              "title": "Lambda p95 duration per function (ms)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "stat": "p95",
              "period": 300,
              "metrics": [
                ["AWS/Lambda", "Duration", "FunctionName", "${PollFunction}", {"label": "Poll"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${IngestFunction}", {"label": "Ingest"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${RegistryFunction}", {"label": "Registry"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${WeatherFunction}", {"label": "Weather"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${DispatchFunction}", {"label": "Dispatch"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${RetentionFunction}", {"label": "Retention"}],
                ["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"label": "Api"}]
              ]}}
          ]
        }

  # ---------------- alarms ----------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SCADA files are failing ingestion repeatedly
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  IngestLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ingest queue is backing up
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  StaleDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Latest SCADA interval is more than 30 minutes old. Missing data also alarms:
        it means the poller itself has stopped reporting.
      Namespace: SolarOps
      MetricName: IngestLagMinutes
      Dimensions:
        - Name: service
          Value: solarops
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The HTTP API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (try /health and /docs)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  RawBucketName:
    Value: !Ref RawBucket
  IngestQueueUrl:
    Value: !Ref IngestQueue
  DeadLetterQueueUrl:
    Value: !Ref IngestDLQ
  DashboardUrl:
    Description: CloudWatch dashboard for the API, copilot, LLM spend and ingestion
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}
